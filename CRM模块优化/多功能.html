    <style>

        .btn-main { padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; color: #fff; cursor: pointer; font-size: 13px; text-align: center; }
        #container { margin: 15px auto; display: flex; flex-direction: column; align-items: center; }
        .page-wrapper { background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 12px; overflow: hidden; position: relative; border: 0.1px solid #eee; }
        .size-100-100 { width: 100mm; height: 100mm; }

        .size-80-80 { width: 80mm; height: 80mm; }

        .code-area { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .barcode-img { max-width: 100%; height: auto; }

        .footer-made { width: 100%; border: 2px solid #000; text-align: center; font-size: 16px; font-weight: bold; padding: 1mm; }
        .title { font-size: 15px; font-weight: bold; margin-bottom: 10px; border-left: 4px solid #4a90e2; padding-left: 8px; }

<script>
var lastBatchData = null;
let currDate = new Date(), rates = {}, memos = JSON.parse(localStorage.getItem('hcn_calendar_memos') || '{}');

window.onload = () => { initRates(); };

function switchTab(idx) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
    document.getElementById('tab' + idx).classList.add('active');
    document.querySelectorAll('.tab-item')[idx-1].classList.add('active');
    if(idx === 4) initCalendar();
    if(idx === 5) setTimeout(updateStockChart, 100);
}

// 标签预览生成
function handleGenerate() {
    const qty = parseInt(document.getElementById('qty').value) || 1;
    const prefix = document.getElementById('prefix').value || "HCN";
    const mode = document.getElementById('mode');
    const modeText = (mode.value === "CUSTOM") ? document.getElementById('custom-mode-input').value : mode.options[mode.selectedIndex].text;
    const size = document.getElementById('label-size').value;
    const type = document.getElementById('code-type').value;
    const container = document.getElementById('container');
    container.innerHTML = '';
    
    const now = new Date();
    const track = `${prefix}${now.toISOString().slice(2,10).replace(/-/g,'')}${Math.floor(Math.random()*900+100)}`;
    lastBatchData = { mode: modeText, mainTracking: track, total: qty, date: now.toLocaleDateString(), size: size };

    for(let i=1; i<=qty; i++) {
        const trk = `${track}-${i}`;
        const wrapper = document.createElement('div');
        wrapper.className = `page-wrapper ${size}`;
        let codeImg = '';
        if(type === 'BARCODE') {
            JsBarcode(document.getElementById('temp-canvas'), trk, { format: "CODE128", width: 1.8, height: 70, displayValue: false });
            codeImg = document.getElementById('temp-canvas').toDataURL();
        } else {
            const qr = document.getElementById('qr-gen-box'); qr.innerHTML = '';
            new QRCode(qr, { text: trk, width: 250, height: 250 });
            codeImg = qr.querySelector('canvas').toDataURL();
        }
        wrapper.innerHTML = `<div class="label-content"><div class="header-mode">${modeText}</div><div style="text-align:center"><div class="big-qty">${i} / ${qty}</div><div class="big-tracking">${trk}</div></div><div class="code-area"><img src="${codeImg}" class="${type==='BARCODE'?'barcode-img':'qrcode-img'}"></div><div class="footer-made">MADE IN CHINA</div></div>`;
        container.appendChild(wrapper);
    }
    showToast("预览已生成");
}

// 手机兼容 PDF 导出
async function handleExportPDF() {
    const pages = document.querySelectorAll('.page-wrapper');
    if(!pages.length || !lastBatchData) return alert("请先预览标签");
    const btn = document.getElementById('btn-share-pdf');
    btn.innerText = "生成中..."; btn.disabled = true;
    const dims = { 'size-100-100': [100, 100], 'size-100-50': [100, 50], 'size-80-80': [80, 80] }[lastBatchData.size];
    try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: dims, compress: true });
        for (let i = 0; i < pages.length; i++) {
            const canvas = await html2canvas(pages[i], { scale: 1.5, useCORS: true });
            if (i > 0) pdf.addPage(dims);
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.7), 'JPEG', 0, 0, dims[0], dims[1]);
        }
        const pdfOutput = pdf.output('blob');
        const blobURL = URL.createObjectURL(pdfOutput);
        const dl = document.createElement('a');
        dl.href = blobURL; dl.download = `${lastBatchData.mainTracking}.pdf`;
        document.body.appendChild(dl); dl.click(); document.body.removeChild(dl);
        showToast("PDF 导出成功");
    } catch (e) { alert("导出失败，请减少件数再试"); }
    finally { btn.innerText = "3. 分享/下载 PDF"; btn.disabled = false; }
}

// 手机兼容 CSV 导出
function handleExportCSV() {
    if(!lastBatchData) return alert("请先预览");
    const csvContent = "\ufeff运输方式,主单号,总件数,日期\n" + `"${lastBatchData.mode}","${lastBatchData.mainTracking}",${lastBatchData.total},"${lastBatchData.date}"`;
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `${lastBatchData.mainTracking}.csv`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    showToast("CSV 已下载");
}

// 汇率转换功能
async function initRates() {
    try { const res = await fetch('https://open.er-api.com/v6/latest/USD'); const data = await res.json(); rates = data.rates; convertRate('left'); } catch(e){}
}
function convertRate(dir) {
    if(!rates.USD) return;
    const from = document.getElementById('cur-left').value, to = document.getElementById('cur-right').value;
    const l = document.getElementById('val-left'), r = document.getElementById('val-right');
    if(dir === 'left') r.value = (l.value / rates[from] * rates[to]).toFixed(2);
    else l.value = (r.value / rates[to] * rates[from]).toFixed(2);
}

// 天气查询
async function getRichWeather() {
    const city = document.getElementById('city-input').value || 'Shenzhen';
    try {
        const res = await fetch(`https://wttr.in/${city}?format=j1`);
        const data = await res.json();
        const cur = data.current_condition[0];
        document.getElementById('w-temp').innerText = `${cur.temp_C}°C`;
        document.getElementById('w-desc').innerText = `${city} · ${cur.weatherDesc[0].value}`;
        document.getElementById('w-wind').innerText = `${cur.windspeedKmph} km/h`;
        document.getElementById('w-hum').innerText = `${cur.humidity}%`;
        document.getElementById('w-sunr').innerText = cur.astronomy[0].sunrise;
        document.getElementById('w-suns').innerText = cur.astronomy[0].sunset;
    } catch(e){ alert("查询失败"); }
}

// 视频下载
function handleVideoDownload() {
    let url = document.getElementById('videoUrlInput').value.trim();
    if (!url) return alert("请输入链接");
    if (!url.startsWith('http')) url = 'https://' + url;
    document.getElementById('v-status').innerText = "🚀 正在跳转解析器...";
    setTimeout(() => { window.location.href = "https://9xbuddy.com/process?url=" + encodeURIComponent(url); }, 600);
}

// 农历日历
function initCalendar() {
    const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
    const year = currDate.getFullYear(), month = currDate.getMonth();
    document.getElementById('cal-month-title').innerText = `${year}年 ${month + 1}月`;
    ['日','一','二','三','四','五','六'].forEach(l => grid.innerHTML += `<div class="cal-cell" style="font-weight:bold;height:35px;background:#f8f9fa;">${l}</div>`);
    const first = new Date(year, month, 1).getDay(), days = new Date(year, month + 1, 0).getDate();
    for(let i=0; i<first; i++) grid.innerHTML += `<div class="cal-cell"></div>`;
    for(let d=1; d<=days; d++) {
        const key = `${year}-${month+1}-${d}`, isToday = new Date().toDateString() === new Date(year, month, d).toDateString();
        const lunarDate = Lunar.fromDate(new Date(year, month, d));
        const cell = document.createElement('div'); cell.className = 'cal-cell';
        cell.innerHTML = `${isToday?'<div class="today-circle">'+d+'</div>':d}<div class="lunar-text">${lunarDate.getJieQi() || lunarDate.getDayInChinese()}</div>${memos[key]?'<div class="event-dot"></div>':''}`;
        cell.onclick = () => {
            const n = prompt(`备注:`, memos[key]||"");
            if(n!==null) { if(!n.trim()) delete memos[key]; else memos[key]=n; localStorage.setItem('hcn_calendar_memos', JSON.stringify(memos)); initCalendar(); }
        };
        grid.appendChild(cell);
    }
}
function changeMonth(d) { currDate.setMonth(currDate.getMonth() + d); initCalendar(); }

// 其他辅助
function updateStockChart() {
    const symbol = document.getElementById('stock-search').value || "300446";
    document.getElementById('stock-chart-container').innerHTML = '';
    new TradingView.widget({"autosize":true,"symbol":symbol,"interval":"D","timezone":"Etc/UTC","theme":"light","style":"1","locale":"zh_CN","container_id":"stock-chart-container","toolbar_bg":"#f1f3f6","withdateranges":true,"hide_side_toolbar":false,"save_image":true,"studies":["RSI@tv-basicstudies"]});
}
function toggleCustomMode() { document.getElementById('custom-mode-input').style.display = (document.getElementById('mode').value === "CUSTOM") ? "block" : "none"; }
function copyJpAddress() { navigator.clipboard.writeText(`〒${document.getElementById('zip-jp').value} ${document.getElementById('region-jp').value}${document.getElementById('locality-jp').value}${document.getElementById('street-jp').value}`).then(() => showToast("地址已复制")); }
function copyInfo() { if(!lastBatchData) return alert("请先预览"); navigator.clipboard.writeText(`单号: ${lastBatchData.mainTracking}\n件数: ${lastBatchData.total}\n运输: ${lastBatchData.mode}`).then(() => showToast("已复制")); }
function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
</script>
