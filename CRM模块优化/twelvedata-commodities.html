<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twelve Data商品列表查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #166534; margin-bottom: 20px; font-size: 20px; }
        .section {
            margin-bottom: 30px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .section h2 { color: #374151; margin-bottom: 15px; font-size: 16px; }
        button {
            padding: 10px 20px;
            background: #166534;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover { background: #15803d; }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 500px;
            overflow-y: auto;
        }
        .oil-symbol {
            display: inline-block;
            padding: 4px 8px;
            margin: 4px;
            background: #dbeafe;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .oil-symbol:hover { background: #bfdbfe; }
        .oil-symbol.success { background: #d1fae5; color: #065f46; }
        .oil-symbol.error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Twelve Data 商品符号查询</h1>
        
        <div class="section">
            <h2>1. 查询Twelve Data支持的商品列表</h2>
            <button onclick="getCommoditiesList()">获取商品列表</button>
            <div id="commodities-result" class="result"></div>
        </div>
        
        <div class="section">
            <h2>2. 测试所有可能的原油符号</h2>
            <p style="margin-bottom:10px; color:#6b7280; font-size:13px;">点击符号测试是否可用</p>
            <div id="oil-symbols"></div>
            <div id="test-result" class="result"></div>
        </div>
        
        <div class="section">
            <h2>3. 推荐方案</h2>
            <div id="recommendation" class="result">
根据研究，布伦特原油在不同平台有以下符号：
- BZ: NYMEX标准符号
- BRN: Bloomberg/Reuters符号
- LCO: ICE Futures Europe符号
- CO: 欧洲市场符号
- BRENTOIL: 通用符号

如果Twelve Data不支持布伦特原油，建议：
1. 使用WTI原油 (CL) 作为替代
2. 使用其他支持布伦特原油的数据源
3. 联系Twelve Data确认是否支持布伦特原油
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "9739029be2174a14a23485c91380abe3";
        
        // 所有可能的原油符号
        const oilSymbols = [
            "UKOIL", "BRENT", "BRN", "BZ", "BCO", "OIL", "XTI/USD", 
            "LCO", "CO", "BRENTOIL", "CRUDEOIL", "BRENTUSD",
            "WTI", "CL", "USOIL", "USOILUSD"
        ];
        
        // 初始化符号按钮
        function initOilSymbols() {
            const container = document.getElementById('oil-symbols');
            oilSymbols.forEach(symbol => {
                const btn = document.createElement('span');
                btn.className = 'oil-symbol';
                btn.textContent = symbol;
                btn.onclick = () => testSymbol(symbol, btn);
                container.appendChild(btn);
            });
        }
        
        async function getCommoditiesList() {
            const result = document.getElementById('commodities-result');
            result.textContent = '正在查询商品列表...';
            
            try {
                // Twelve Data的commodities端点
                const url = `https://api.twelvedata.com/commodities?apikey=${API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.data && Array.isArray(data.data)) {
                    // 查找原油相关的商品
                    const oilRelated = data.data.filter(item => 
                        item.symbol && (
                            item.symbol.toLowerCase().includes('oil') ||
                            item.symbol.toLowerCase().includes('brent') ||
                            item.symbol.toLowerCase().includes('crude') ||
                            item.symbol.toLowerCase().includes('cl') ||
                            item.name.toLowerCase().includes('oil') ||
                            item.name.toLowerCase().includes('crude')
                        )
                    );
                    
                    result.textContent = `找到 ${data.data.length} 个商品\n\n`;
                    result.textContent += `原油相关商品 (${oilRelated.length}个):\n`;
                    result.textContent += oilRelated.map(item => 
                        `- ${item.symbol}: ${item.name} (${item.exchange || 'N/A'})`
                    ).join('\n');
                    
                    // 添加所有商品
                    result.textContent += '\n\n所有商品:\n';
                    result.textContent += data.data.slice(0, 50).map(item => 
                        `${item.symbol}: ${item.name}`
                    ).join('\n');
                    
                    if (data.data.length > 50) {
                        result.textContent += `\n... 还有 ${data.data.length - 50} 个商品`;
                    }
                } else {
                    result.textContent = JSON.stringify(data, null, 2);
                }
            } catch (err) {
                result.textContent = `错误: ${err.message}`;
            }
        }
        
        async function testSymbol(symbol, btn) {
            const result = document.getElementById('test-result');
            result.textContent = `测试 ${symbol}...\n`;
            
            // 测试time_series
            const url = `https://api.twelvedata.com/time_series?symbol=${symbol}&interval=1day&outputsize=10&apikey=${API_KEY}`;
            result.textContent += `URL: ${url.replace(API_KEY, 'API_KEY_HIDDEN')}\n\n`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.status === "error") {
                    result.textContent += `❌ 错误: ${data.message}\n`;
                    btn.className = 'oil-symbol error';
                } else if (data.values && data.values.length > 0) {
                    result.textContent += `✅ 成功! ${data.values.length}个数据点\n`;
                    result.textContent += `最新价格: ${data.values[0].close}\n`;
                    result.textContent += `时间: ${data.values[0].datetime}\n`;
                    btn.className = 'oil-symbol success';
                } else {
                    result.textContent += `❌ 无数据\n`;
                    btn.className = 'oil-symbol error';
                }
                
                result.textContent += `\n完整响应:\n${JSON.stringify(data, null, 2)}`;
            } catch (err) {
                result.textContent += `❌ 异常: ${err.message}`;
                btn.className = 'oil-symbol error';
            }
        }
        
        // 自动测试所有符号
        async function testAllSymbols() {
            for (const symbol of oilSymbols) {
                const btn = document.querySelector(`.oil-symbol:nth-child(${oilSymbols.indexOf(symbol) + 1})`);
                await testSymbol(symbol, btn);
                await new Promise(r => setTimeout(r, 500)); // 延迟500ms避免限流
            }
        }
        
        // 页面加载时初始化
        initOilSymbols();
    </script>
</body>
</html>
